[project]
name = "schema-api"
version = "0.1.0"
description = "A Django REST API to expose the Amsterdam Schema."
readme = "README.md"
requires-python = ">=3.14"
license = "EUPL-1.2"
author = "Team Data Diensten, van het Dataplatform onder de Directie Digitale Voorzieningen (Gemeente Amsterdam)"
author_email = "datapunt@amsterdam.nl"

dependencies = [
    "django >= 5.2.15, < 6.0",
    "django-environ==0.14.0",
    "django-cors-headers==4.9.0",
    "django-healthchecks==1.5.0",
    "djangorestframework==3.17.1",
    "drf_spectacular==0.29.0",
    "amsterdam-schema-tools[django]==9.11.1",
    "python-json-logger==4.1.0",
    "requests==2.34.2",
    "uwsgi>=2.0.31",
    "more-ds==0.0.6",
    "orjson==3.11.9",
    "whitenoise==6.12.0",
    "jwcrypto==1.5.8",
]

monitoring = [
    "azure-monitor-opentelemetry == 1.8.6",
    "azure-identity == 1.25.3",
    "uwsgitop == 0.12",
    "uwsgi-readiness-check == 0.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
    "python-owasp-zap-v2.4==0.1.0",
    "requests-mock==1.12.1",
    "pur==7.4.0",
    "setuptools==83.0.0",
    "pre-commit==4.6.0",
    "ruff==0.15.20",
    "django-extensions==4.1",
    "pytest-sugar==1.1.1",
    "termcolor==3.3.0",
    "django-debug-toolbar==7.0.0",
    "django-extensions==4.1",
]

[project.urls]
Homepage = "https://github.com/Amsterdam/amsterdam-schema-api"
Repository = "https://github.com/Amsterdam/amsterdam-schema-api"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "schema_api"
module-root = "src"

# ==== pytest ====
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
minversion = "6.0"
django_find_project = false
pythonpath = "."
testpaths = ["tests"]
addopts = [
    "--doctest-modules",
    "--nomigrations",
    "--reuse-db",
    "--ds=tests.settings"
]
norecursedirs = ["node_modules", ".tox", ".git", "dist", "build", "venv", ".venv"]
filterwarnings = [
    "once::DeprecationWarning",
    "once::PendingDeprecationWarning",
    "ignore:Model '.*' was already registered. Reloading models is not advised.*:RuntimeWarning"
]

# ==== Coverage ====
[tool.coverage.run]
branch = true
source = ["gisserver"]
omit = ["*/migrations/*.py", "*/test*.py", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py38"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    "S607", # subprocess partial path
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.utils.timezone.make_aware".msg = "There is no need for make_aware(), pass tzinfo directly."

[tool.ruff.lint.isort]
known-first-party = ["dso_api", "rest_framework_dso", "tests"]
known-third-party = ["gisserver", "schematools"]
#required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/tests/**/*.py" = ["DJ008", "S101", "S105", "S106", "S314", "S320", "S608"] # allow asserts, hardcoded passwords, lxml parsing, SQL injection
"**/migrations/*.py" = ["E501"]  # line too long
"docs/_ext/djangodummy/settings.py" = ["S105"]  # allow hardcoded SECRET_KEY
"src/tests/settings.py" = ["F405"]  # allow unknown variables via import from *
